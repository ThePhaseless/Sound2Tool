[project]
name = "sound2tool"
version = "0.1.0"
description = "NSynth instrument classification - identify instruments from audio notes"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "librosa",
    "torch",
    "torchaudio",
    "ipywidgets",
    "tqdm",
    "pypdl",
    "soundfile",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "ipykernel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[[tool.uv.index]]
name = 'pytorch'
url = "https://download.pytorch.org/whl/cu130"

[tool.uv.sources]
torch = { index = "pytorch" }


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
